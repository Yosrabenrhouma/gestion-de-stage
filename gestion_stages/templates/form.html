{% extends "base.html" %}{% block content %}
<div class="card shadow-sm" style="max-width:720px"><div class="card-body">
<h4>{{ titre }}</h4>
<form method="post" enctype="multipart/form-data">{% csrf_token %}
 {{ form.non_field_errors }}
 {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
  {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  {% if f.help_text %}<div class="form-text">{{ f.help_text }}</div>{% endif %}</div>{% endfor %}
 <button class="btn btn-brand">Enregistrer</button>
</form></div></div>{% endblock %}
