{% extends "base.html" %}{% block content %}<h3>Sujets proposés par les étudiants</h3>
{% for s in sujets %}<div class="card mb-2"><div class="card-body d-flex justify-content-between align-items-center">
<div><b>{{ s.sujet }}</b><br>{{ s.etudiant }} · {{ s.entreprise }} · {{ s.get_type_display }}</div>
<div><form method="post" action="{% url 'sujet_decide' s.pk 'valider' %}" class="d-inline">{% csrf_token %}<button class="btn btn-sm btn-success">Valider</button></form>
<form method="post" action="{% url 'sujet_decide' s.pk 'refuser' %}" class="d-inline">{% csrf_token %}<button class="btn btn-sm btn-danger">Refuser</button></form></div></div></div>
{% empty %}<p class="text-muted">Aucun sujet en attente.</p>{% endfor %}{% endblock %}
